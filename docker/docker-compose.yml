version: "3.9"

# ─────────────────────────────────────────────────────────────────────────────
# SpecGuard AI — Development Infrastructure Stack
# Services: PostgreSQL 16 + Redis 7 + Backend (FastAPI) + Frontend (Vite)
#
# Usage:
#   Start:   docker compose -f docker/docker-compose.yml up -d
#   Stop:    docker compose -f docker/docker-compose.yml down
#   Logs:    docker compose -f docker/docker-compose.yml logs -f
#   Reset:   docker compose -f docker/docker-compose.yml down -v
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ─── FastAPI Backend ─────────────────────────────────────────────────────────
  backend:
    build:
      context: ../backend
      dockerfile: ../docker/Dockerfile
    image: specguard-backend:latest
    container_name: specguard_backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://aitester:password@postgres:5432/aitester
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
      - ENVIRONMENT=production
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-changeme-replace-in-production}
      - ALLOWED_ORIGINS=["http://localhost:5173","http://localhost:80"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - specguard-net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  # ─── PostgreSQL 16 ───────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: specguard_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: aitester
      POSTGRES_USER: aitester
      POSTGRES_PASSWORD: password
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "15432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aitester -d aitester"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - specguard-net

  # ─── Redis 7 ─────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: specguard_redis
    restart: unless-stopped
    command: >
      redis-server
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --loglevel warning
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - specguard-net

# ─── Volumes ──────────────────────────────────────────────────────────────────
volumes:
  pgdata:
    driver: local
  redisdata:
    driver: local

# ─── Networks ─────────────────────────────────────────────────────────────────
networks:
  specguard-net:
    driver: bridge
    name: specguard-net
