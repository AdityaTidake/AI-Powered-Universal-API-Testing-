# ─────────────────────────────────────────────────────────────────────────────
# SpecGuard AI — Development Infrastructure Stack
# Services: MongoDB 6 + Redis 7 + Backend (FastAPI) + Celery Worker + Celery Beat
#
# Usage:
#   Start:   docker compose -f docker/docker-compose.yml up -d
#   Stop:    docker compose -f docker/docker-compose.yml down
#   Logs:    docker compose -f docker/docker-compose.yml logs -f
#   Reset:   docker compose -f docker/docker-compose.yml down -v
#
# NOTE: The image is built ONCE by the `backend` service.
#       celery_worker and celery_beat reuse the same built image.
# ─────────────────────────────────────────────────────────────────────────────

# Shared environment variables — reused across all backend services.
x-backend-env: &backend-env
  MONGODB_URL: mongodb://mongodb:27017
  MONGODB_DB_NAME: specguard
  REDIS_URL: redis://redis:6379/0
  CELERY_BROKER_URL: redis://redis:6379/1
  CELERY_RESULT_BACKEND: redis://redis:6379/2
  ENVIRONMENT: production
  GEMINI_API_KEY: ${GEMINI_API_KEY:-}
  JWT_SECRET_KEY: ${JWT_SECRET_KEY:-changeme-replace-in-production}
  ALLOWED_ORIGINS: '["http://localhost:5173","http://localhost:80"]'

services:

  # ─── FastAPI Backend ──────────────────────────────────────────────────────
  # This is the ONLY service that builds the image.
  # celery_worker and celery_beat reference the resulting image by name.
  backend:
    build:
      context: ../backend
      dockerfile: ../docker/Dockerfile
    image: specguard-backend:latest
    container_name: specguard_backend
    ports:
      - "8000:8000"
    environment:
      <<: *backend-env
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - specguard-net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  # ─── Celery Worker ────────────────────────────────────────────────────────
  # Reuses the image built by the backend service — no separate build step.
  # Executes test runs offloaded from the API (execute_test_run task).
  celery_worker:
    image: specguard-backend:latest
    pull_policy: never
    container_name: specguard_celery_worker
    command: >
      celery -A aitester.worker worker
      --loglevel=info
      --queues=test_runs,celery
      --autoscale=8,2
      --hostname=worker@%h
    environment:
      <<: *backend-env
    depends_on:
      backend:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - specguard-net
    restart: unless-stopped

  # ─── Celery Beat (scheduler) ──────────────────────────────────────────────
  # Reuses the image built by the backend service — no separate build step.
  # Triggers periodic tasks (monthly quota reset, stale-run cleanup).
  # IMPORTANT: Run exactly ONE instance of this service.
  celery_beat:
    image: specguard-backend:latest
    pull_policy: never
    container_name: specguard_celery_beat
    command: >
      celery -A aitester.worker beat
      --loglevel=info
      --schedule=/tmp/celerybeat-schedule
    environment:
      <<: *backend-env
    depends_on:
      backend:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - specguard-net
    restart: unless-stopped

  # ─── MongoDB 6 ────────────────────────────────────────────────────────────
  mongodb:
    image: mongo:6
    container_name: specguard_mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: specguard
    ports:
      - "27017:27017"
    volumes:
      - mongodata:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.runCommand({ ping: 1 })", "--quiet"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - specguard-net

  # ─── Redis 7 ──────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: specguard_redis
    restart: unless-stopped
    command: >
      redis-server
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --loglevel warning
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - specguard-net

# ─── Volumes ──────────────────────────────────────────────────────────────────
volumes:
  mongodata:
    driver: local
  redisdata:
    driver: local

# ─── Networks ─────────────────────────────────────────────────────────────────
networks:
  specguard-net:
    driver: bridge
    name: specguard-net
